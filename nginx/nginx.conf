worker_processes auto;
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=10s;   # DNS interno de Docker
    log_format main '$remote_addr [$time_local] "$request" $status $request_time';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;

        location /pedido {
            set $up http://servicio_pedidos:8000;
            proxy_pass $up;
            proxy_read_timeout 10s;
        }
        location /usuarios/ {
            set $up http://servicio_usuarios:8000;
            proxy_pass $up;
            proxy_read_timeout 10s;
        }
        location /nginx_status {
            stub_status;
            allow all;
        }
        location /health {
            return 200 "ok\n";
        }
    }
}
