name: cloud_anomaly

x-db-env: &db-env
  DB_DSN: "postgresql://app:app@postgres:5432/cloud"

services:
  # ---- punto de entrada (API Gateway) -------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8000:80"          # unico punto de entrada para el trafico (JMeter / run_scenario)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - servicio_pedidos
      - servicio_usuarios
    networks: [cloud_net]

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx_exporter
    command: ["--nginx.scrape-uri=http://nginx:80/nginx_status"]
    depends_on:
      - nginx
    networks: [cloud_net]

  # ---- microservicios -------------------------------------------------------
  servicio_pedidos:
    build: ./servicio_pedidos
    container_name: servicio_pedidos
    ports:
      - "8002:8000"        # solo para /admin y pruebas directas
    environment:
      <<: *db-env
      PAGOS_URL: "http://servicio_pagos:8000/procesar"
      PAGOS_TIMEOUT: "3"
      NOTIF_URL: "http://servicio_notificaciones:8000/notificar"
    depends_on:
      postgres:
        condition: service_healthy
      servicio_pagos:
        condition: service_started
      servicio_notificaciones:
        condition: service_started
    cpus: 1.0            # margen: ~0.30 en reposo a 50 rps (con Notificaciones); el CPU overload lo acerca al limite
    cap_add:
      - NET_ADMIN        # tc netem dirigido a Pagos (latencia del enlace Pedidos->Pagos)
    networks: [cloud_net]

  servicio_pagos:
    build: ./servicio_pagos
    container_name: servicio_pagos
    ports:
      - "8001:8000"        # solo para /admin y pruebas directas
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    networks: [cloud_net]

  servicio_usuarios:
    build: ./servicio_usuarios
    container_name: servicio_usuarios
    ports:
      - "8003:8000"        # solo para pruebas directas
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    networks: [cloud_net]

  servicio_notificaciones:
    build: ./servicio_notificaciones
    container_name: servicio_notificaciones
    ports:
      - "8004:8000"        # solo para pruebas directas
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    networks: [cloud_net]

  # ---- base de datos ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: cloud
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 1.0
    networks: [cloud_net]

  # ---- monitoreo ------------------------------------------------------------------
  docker_exporter:
    build: ./monitor
    container_name: docker_exporter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [cloud_net]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [cloud_net]

networks:
  cloud_net:
    name: cloud_net

volumes:
  prometheus_data:
  postgres_data:
