global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
  - job_name: 'servicio_pedidos'
    static_configs:
      - targets: ['servicio_pedidos:8000']
  - job_name: 'servicio_pagos'
    static_configs:
      - targets: ['servicio_pagos:8000']
  - job_name: 'servicio_usuarios'
    static_configs:
      - targets: ['servicio_usuarios:8000']
  - job_name: 'servicio_notificaciones'
    static_configs:
      - targets: ['servicio_notificaciones:8000']
  - job_name: 'docker_exporter'
    static_configs:
      - targets: ['docker_exporter:9200']
